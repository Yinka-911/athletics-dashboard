<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Athletics Timing Dashboard</title>

  <!-- Firebase v9 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-green: #22c55e;
      --accent-yellow: #eab308;
      --accent-red: #ef4444;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .subhead {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .btn-audio {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      background-color: var(--accent-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-audio.active {
      background-color: var(--accent-green);
      color: #ffffff;
    }

    .status-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .status-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .status-badge {
      font-size: 1.6rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 8px 20px;
      border-radius: 20px;
      background-color: var(--border-color);
      color: var(--text-color);
      letter-spacing: 0.5px;
    }

    .status-badge.get_ready { background-color: var(--accent-yellow); color: #0f172a; }
    .status-badge.go { background-color: var(--accent-green); color: #ffffff; }
    .status-badge.resting { background-color: var(--accent-color); color: #0f172a; }
    .status-badge.stopped { background-color: var(--accent-red); color: #ffffff; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    td {
      font-size: 1rem;
      font-weight: 500;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Athletics Timing Dashboard</h1>
    <p class="subhead">Session ID: -P01tCM7gaRQbBDx3JEu</p>
  </header>

  <div class="container">
    <!-- Enable Audio Button -->
    <div class="card">
      <button id="audioBtn" class="btn-audio" onclick="enableAudio()">Enable Audio Cues</button>
    </div>

    <!-- Live Status Display -->
    <div class="card status-box">
      <div class="status-label">Current Status</div>
      <div id="statusBadge" class="status-badge">STANDBY</div>
    </div>

    <!-- Recorded Reps -->
    <div class="card">
      <div class="status-label" style="margin-bottom: 12px;">Completed Reps</div>
      <table>
        <thead>
          <tr>
            <th>Rep #</th>
            <th>Time</th>
            <th>Rest Before</th>
          </tr>
        </thead>
        <tbody id="repsTableBody">
          <tr>
            <td colspan="3" class="empty-state">Waiting for timing data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ============================================================
    // FIREBASE CONFIGURATION
    // ============================================================
    const firebaseConfig = {
      databaseURL: "https://athletics-coach-d0b26-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const TEST_UID = "OckrD0RsTXXAAwYTxmdRnRXFOtc2";
    const TEST_SESSION_ID = "-P01tCM7gaRQbBDx3JEu";
    const sessionRef = db.ref(`sessions/${TEST_UID}/${TEST_SESSION_ID}`);

    // ============================================================
    // WEB AUDIO & SPEECH SYNTHESIS ENGINE
    // ============================================================
    let audioCtx = null;
    let audioEnabled = false;

    function enableAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audioEnabled = true;

      const btn = document.getElementById('audioBtn');
      btn.textContent = 'Audio Enabled';
      btn.classList.add('active');

      // Test chime to confirm audio interaction
      playTone(523.25, 0.1, 0);
    }

    function playTone(freq, duration, delay = 0) {
      if (!audioCtx || !audioEnabled) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function speak(text) {
      if (!audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.1;
      window.speechSynthesis.speak(utter);
    }

    // ============================================================
    // AUDIO CUE FUNCTIONS
    // ============================================================
    function playReadyCue() {
      playTone(660, 0.18, 0);
      setTimeout(() => {
        speak("Get ready");
      }, 250);
    }

    function playGoCue() {
      playTone(1175, 0.20, 0);
      setTimeout(() => {
        speak("Go");
      }, 200);
    }

    // ============================================================
    // FIREBASE LISTENERS
    // ============================================================
    let lastStatus = "";

    sessionRef.child('status').on('value', (snapshot) => {
      const status = snapshot.val();
      if (!status || status === lastStatus) return;

      lastStatus = status;
      updateStatusDisplay(status);

      if (status === 'get_ready') {
        playReadyCue();
      } else if (status === 'go') {
        playGoCue();
      } else if (status === 'resting') {
        speak("Rest");
      } else if (status === 'finished') {
        speak("Session complete");
      } else if (status === 'stopped') {
        speak("Run aborted");
      }
    });

    sessionRef.child('reps').on('value', (snapshot) => {
      const repsData = snapshot.val();
      updateRepsTable(repsData);
    });

    // ============================================================
    // UI UPDATES
    // ============================================================
    function updateStatusDisplay(status) {
      const badge = document.getElementById('statusBadge');
      badge.textContent = status.replace('_', ' ');
      badge.className = 'status-badge ' + status;
    }

    function updateRepsTable(reps) {
      const tbody = document.getElementById('repsTableBody');
      if (!reps) {
        tbody.innerHTML = `<tr><td colspan="3" class="empty-state">No reps recorded yet.</td></tr>`;
        return;
      }

      let html = '';
      Object.keys(reps).forEach((repKey) => {
        const rep = reps[repKey];
        html += `
          <tr>
            <td>Rep ${repKey}</td>
            <td>${Number(rep.time).toFixed(2)} s</td>
            <td>${Number(rep.restBefore).toFixed(1)} s</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }
  </script>
</body>
</html>
