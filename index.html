<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Training Session — Track Coaching Assistant
  </title>


  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15151A">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Track Timer">
  <link rel="apple-touch-icon" href="icon-192.png">


  <style>

    :root {
      --ink: #EDEDEF;
      --ink-dim: #9A9AA5;
      --bg: #15151A;
      --bg-raised: #1D1D24;
      --line: #2B2B34;
      --cinder: #C1442E;
      --amber: #F2A93B;
      --live-green: #4CAF6D;
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
      min-height: 100vh;
    }


    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
    }


    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }


    .brand .mark {
      font-family:
        "SF Mono",
        "JetBrains Mono",
        ui-monospace,
        monospace;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--cinder);
      letter-spacing: 0.04em;
    }


    .brand h1 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
    }


    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--ink-dim);
    }


    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-dim);
    }


    .status.connected .dot {
      background: var(--live-green);
      animation: pulse 2s infinite;
    }


    @keyframes pulse {

      0% {
        box-shadow:
          0 0 0 0 rgba(
            76,
            175,
            109,
            0.5
          );
      }

      70% {
        box-shadow:
          0 0 0 8px rgba(
            76,
            175,
            109,
            0
          );
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(
            76,
            175,
            109,
            0
          );
      }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }


    #loginView {
      max-width: 360px;
      margin: 80px auto 0;
      padding: 32px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 10px;

    #loginView h2 {
      margin-top: 0;
      font-size: 1.15rem;
    }


    #loginView label {
      display: block;
      font-size: 0.78rem;
      color: var(--ink-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 16px 0 6px;

      width: 100%;
      padding: 12px 14px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);

    .btn {
      border: none;
      border-radius: 7px;
      padding: 11px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 18px;
    }


    .btn-primary {
      background: var(--cinder);
      color: white;
    }


    .btn-outline {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }


    .btn-end {
      background: #4A2521;
      color: #FFB7AA;
    }


    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }


    #loginError {
      margin-top: 14px;
      color: #FF8F80;
      font-size: 0.84rem;

    #appView {
      display: none;

    .top-row {
      display: flex;

      align-items: center;
      gap: 20px;
      margin-bottom: 24px;

    .athlete-name {
      margin: 0;

    }


    .athlete-sub {
      margin: 4px 0 0;

    }


    .session-panel {
      padding: 24px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 10px;
    }


    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #292931;
      color: var(--ink-dim);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }


    .badge.live {

      color: #8DDAA5;

    .rep-count {

    }


    .cue-status {
      margin-top: 20px;
      padding: 11px 13px;
      background: #18181D;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-family:

        "JetBrains Mono",
        ui-monospace,
        monospace;
      font-size: 0.8rem;
    }


    .lanes {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }


    .rep-row {
      display: grid;
      grid-template-columns:
        60px
        1fr
        auto;
      gap: 14px;
      align-items: center;
      padding: 17px 18px;
      border-bottom: 1px solid var(--line);
    }


    .rep-row:last-child {

    }


    .rep-num {
      font-family:
        "SF Mono",
        "JetBrains Mono",
        ui-monospace,
        monospace;
      font-weight: 700;
    }


    .rep-rest {
      color: var(--ink-dim);
      font-size: 0.8rem;
    }


    .rep-time {
      font-family:
        "SF Mono",
        "JetBrains Mono",
        ui-monospace,
        monospace;
      font-size: 1.3rem;

    }


    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-dim);
      font-size: 0.9rem;
    }


    footer {

      padding: 24px;
      color: var(--ink-dim);

      header {

        padding: 15px;
      }

<script type="module">


// ================================================================

// ================================================================
// FIREBASE CONFIG
// ================================================================

const firebaseConfig = {

    "AIzaSyAlYe_Gmmy8B9mxCgVo5PdIZ4y1tndyCis",

  authDomain:
    "athletics-coach-d0b26.firebaseapp.com",

  databaseURL:
    "https://athletics-coach-d0b26-default-rtdb.europe-west1.firebasedatabase.app/",

};


const app =
  initializeApp(

  );


const auth =

// ================================================================
// DOM
// ================================================================

const loginView =
  document.getElementById(
    "loginView"
  );


const appView =
  document.getElementById(
    "appView"
  );


const emailInput =
  document.getElementById(

  );


const passwordInput =
  document.getElementById(
    "password"
  );


const loginBtn =

  );


const loginError =
  document.getElementById(
    "loginError"
  );


const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );


const athleteName =
  document.getElementById(
    "athleteName"
  );


const athleteEmail =
  document.getElementById(
    "athleteEmail"
  );


const sessionPanel =
  document.getElementById(
    "sessionPanel"
  );


const repsList =
  document.getElementById(
    "repsList"
  );


const connectionStatus =
  document.getElementById(
    "connectionStatus"
  );


const connectionLabel =
  document.getElementById(
    "connectionLabel"
  );


// ================================================================
// STATE
// ================================================================

let currentUid = null;

let activeSessionId = null;

let repsUnsub = null;

let statusUnsub = null;

let sessionsUnsub = null;

let lastStatus = null;

let audioContext = null;

let wakeLock = null;


// ================================================================
// WAKE LOCK
// ================================================================
// Keeps the screen on for as long as a session is live, so audio
// cues (which browsers suspend once the screen locks) keep working.

async function requestWakeLock() {

  if (!("wakeLock" in navigator)) {
    console.warn("Wake Lock API not supported on this browser/OS version.");
    return;
  }

  if (wakeLock) {
    return; // already held
  }

  try {

    wakeLock = await navigator.wakeLock.request("screen");

    console.log("Wake lock active — screen will stay on.");

    wakeLock.addEventListener("release", () => {
      console.log("Wake lock released.");
      wakeLock = null;
    });

  } catch (err) {

    console.error("Wake lock request failed:", err);
  }
}


function releaseWakeLock() {

  if (wakeLock) {

    wakeLock.release();

    wakeLock = null;
  }
}


// Browsers auto-release the wake lock whenever the tab is hidden
// (e.g. switching apps briefly). Re-acquire it the moment the app
// becomes visible again, as long as a session is still live.
document.addEventListener("visibilitychange", async () => {

  if (
    document.visibilityState === "visible" &&
    activeSessionId &&
    !wakeLock
  ) {

    await requestWakeLock();
  }
});


// ================================================================
// AUDIO UNLOCK
// ================================================================

function unlockAudio() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (
    !AudioContextClass
  ) {

    console.error(
      "Web Audio API is not supported."
    );

    return;
  }


  if (
    !audioContext
  ) {

    audioContext =
      new AudioContextClass();
  }


  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();
  }


  console.log(
    "Audio state:",
    audioContext.state
  );
}


// ================================================================
// TONE
// ================================================================

function playTone(
  frequency,
  duration,
  delay = 0
) {

  if (
    !audioContext
  ) {

    unlockAudio();
  }


  if (
    !audioContext
  ) {

    return;
  }


  const startTime =
    audioContext.currentTime +
    delay;


  const oscillator =
    audioContext.createOscillator();


  const gain =
    audioContext.createGain();


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    frequency,
    startTime
  );


  gain.gain.setValueAtTime(
    0.0001,
    startTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.35,
    startTime + 0.01
  );


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    startTime + duration
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  oscillator.start(
    startTime
  );


  oscillator.stop(
    startTime +
    duration +
    0.02
  );
}


// ================================================================
// SPEECH
// ================================================================

function speak(
  text
) {

  if (
    !("speechSynthesis" in window)
  ) {

    console.warn(
      "Speech synthesis is not supported."
    );

    return;
  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.rate =
    1.1;


  utterance.pitch =
    1;


  utterance.volume =
    1;


  window.speechSynthesis.speak(
    utterance
  );
}


// ================================================================
// GO CUE
// ================================================================

function playGoCue() {

  // Two short tones.
  playTone(
    880,
    0.12,
    0
  );


  playTone(
    1175,
    0.20,
    0.18
  );


  setTimeout(
    () => {
      speak("Go");
    },
    450
  );
}


// ================================================================
// READY CUE
// ================================================================

function playReadyCue() {

  playTone(
    660,
    0.18,
    0
  );


  setTimeout(
    () => {
      speak("Get ready");
    },
    250
  );
}


// ================================================================
// REST CUE
// ================================================================

function playRestCue() {

  playTone(
    440,
    0.18,
    0
  );


  setTimeout(
    () => {
      speak("Rest");
    },
    250
  );
}


// ================================================================
// FINISHED CUE
// ================================================================

function playFinishedCue() {

  playTone(
    660,
    0.12,
    0
  );


  playTone(
    880,
    0.12,
    0.15
  );


  playTone(
    1047,
    0.25,
    0.30
  );


  setTimeout(
    () => {
      speak(
        "Session finished"
      );
    },
    550
  );
}


// ================================================================
// FIREBASE CONNECTION INDICATOR
// ================================================================

onValue(
  ref(
    database,
    ".info/connected"
  ),
  (snap) => {

    const connected =
      snap.val() === true;


    connectionStatus.classList.toggle(
      "connected",
      connected
    );


    connectionLabel.textContent =
      connected
        ? "Live"
        : "Connecting…";
  }
);


// ================================================================
// AUTHENTICATION
// ================================================================

loginBtn.addEventListener(
  "click",
  async () => {

    loginError.textContent =
      "";


    try {

      await signInWithEmailAndPassword(
        auth,
        emailInput.value.trim(),
        passwordInput.value
      );

    } catch (err) {

      console.error(
        err
      );


      loginError.textContent =
        "Login failed — check email and password.";
    }
  }
);


logoutBtn.addEventListener(
  "click",
  () => {

    signOut(
      auth
    );
  }
);


// ================================================================
// AUTH STATE
// ================================================================

onAuthStateChanged(
  auth,
  (user) => {

    cleanupSessionListeners();


    if (
      sessionsUnsub
    ) {

      sessionsUnsub();

      sessionsUnsub =
        null;
    }


    if (
      !user
    ) {

      currentUid =
        null;


      activeSessionId =
        null;


      lastStatus =
        null;


      loginView.style.display =
        "block";


      appView.style.display =
        "none";


      return;
    }


    currentUid =
      user.uid;


    loginView.style.display =
      "none";


    appView.style.display =
      "block";


    const displayName =
      user.email
        .split("@")[0];


    athleteName.textContent =
      displayName;


    athleteEmail.textContent =
      user.email;


    // Keep athlete profile available
    // for the coaching application.
    update(
      ref(
        database,
        `athletes/${user.uid}`
      ),
      {
        name:
          displayName,

        email:
          user.email
      }
    );


    watchForActiveSession(
      user.uid
    );
  }
);


// ================================================================
// LIVE SESSION STATUS
// ================================================================

function isLiveSessionStatus(
  status
) {

  return [
    "active",
    "get_ready",
    "go",
    "resting"
  ].includes(
    status
  );
}


// ================================================================
// WATCH FOR ACTIVE SESSION
// ================================================================

function watchForActiveSession(
  uid
) {

  if (
    sessionsUnsub
  ) {

    sessionsUnsub();

    sessionsUnsub =
      null;
  }


  sessionsUnsub =
    onValue(
      ref(
        database,
        `sessions/${uid}`
      ),
      (snapshot) => {

        const sessions =
          snapshot.val() || {};


        const liveEntry =
          Object.entries(
            sessions
          ).find(
            ([, session]) =>
              isLiveSessionStatus(
                session.status
              )
          );


        if (
          liveEntry
        ) {

          const sessionId =
            liveEntry[0];


          const sessionData =
            liveEntry[1];


          if (
            activeSessionId !==
            sessionId
          ) {

            activeSessionId =
              sessionId;


            lastStatus =
              null;


            renderActiveSession(
              uid,
              sessionId,
              sessionData
            );

          } else {

            updateCueDisplay(
              sessionData.status
            );
          }

        } else {

          activeSessionId =
            null;


          lastStatus =
            null;


          renderNoActiveSession();
        }
      }
    );
}


// ================================================================
// NO ACTIVE SESSION
// ================================================================

function renderNoActiveSession() {

  cleanupSessionListeners();

  releaseWakeLock();


  sessionPanel.innerHTML = `

    <span class="badge">
      no active session
    </span>


    <div
      class="rep-count-label"
      style="margin-bottom:16px;"
    >
      Start a session before training begins.
    </div>


    <button
      class="btn btn-primary"
      id="beginBtn"
    >
      Begin session
    </button>

  `;


  document
    .getElementById(
      "beginBtn"
    )
    .addEventListener(
      "click",
      async () => {

        unlockAudio();

        await requestWakeLock();

        await beginSession();
      }
    );


  repsList.innerHTML =
    "";
}


// ================================================================
// ACTIVE SESSION
// ================================================================

function renderActiveSession(
  uid,
  sessionId,
  sessionData
) {

  sessionPanel.innerHTML = `

    <span class="badge live">
      session live
    </span>


    <div
      class="rep-count"
      id="repCount"
    >
      0
    </div>


    <div class="rep-count-label">
      rep(s) completed
    </div>


    <div
      class="cue-status"
      id="cueStatus"
    >
      Current status:
      ${sessionData.status || "active"}
    </div>


    <div class="button-row">

      <button
        class="btn btn-primary"
        id="testSoundBtn"
      >
        Test GO Sound
      </button>


      <button
        class="btn btn-end"
        id="endBtn"
      >
        End session
      </button>

    </div>

  `;


  // --------------------------------------------------------------
  // TEST GO SOUND
  // --------------------------------------------------------------

  document
    .getElementById(
      "testSoundBtn"
    )
    .addEventListener(
      "click",
      () => {

        unlockAudio();

        playGoCue();
      }
    );


  // --------------------------------------------------------------
  // END SESSION
  // --------------------------------------------------------------

  document
    .getElementById(
      "endBtn"
    )
    .addEventListener(
      "click",
      endSession
    );


  watchReps(
    uid,
    sessionId
  );


  watchSessionStatus(
    uid,
    sessionId
  );


  // Covers reopening the app onto a session that's already live
  // (not just the initial "Begin session" click).
  requestWakeLock();
}


// ================================================================
// REP LISTENER
// ================================================================

function watchReps(
  uid,
  sessionId
) {

  if (
    repsUnsub
  ) {

    repsUnsub();

    repsUnsub =
      null;
  }


  const repsRef =
    ref(
      database,
      `sessions/${uid}/${sessionId}/reps`
    );


  repsUnsub =
    onValue(
      repsRef,
      (snapshot) => {

        const reps =
          snapshot.val() || {};


        const repIds =
          Object.keys(
            reps
          ).sort(
            (a, b) =>
              Number(a) -
              Number(b)
          );


        const countEl =
          document.getElementById(
            "repCount"
          );


        if (
          countEl
        ) {

          countEl.textContent =
            repIds.length;
        }


        if (
          repIds.length === 0
        ) {

          repsList.innerHTML = `

            <div class="empty-state">
              Waiting on the timing box
              for the first rep…
            </div>

          `;

          return;
        }


        repsList.innerHTML =
          repIds
            .map(
              (id) => {

                const rep =
                  reps[id];


                const restNote =
                  rep.restBefore != null &&
                  Number(
                    rep.restBefore
                  ) > 0

                    ? `${Number(
                        rep.restBefore
                      ).toFixed(0)}s rest before this rep`

                    : "first rep";


                return `

                  <div class="rep-row">

                    <span class="rep-num">
                      #${repIds.indexOf(id) + 1}
                    </span>


                    <div>

                      <div class="rep-rest">
                        ${restNote}
                      </div>

                    </div>


                    <span class="rep-time">
                      ${Number(
                        rep.time
                      ).toFixed(2)}s
                    </span>

                  </div>

                `;
              }
            )
            .join("");
      }
    );
}


// ================================================================
// STATUS LISTENER
// ================================================================

function watchSessionStatus(
  uid,
  sessionId
) {

  if (
    statusUnsub
  ) {

    statusUnsub();

    statusUnsub =
      null;
  }


  const statusRef =
    ref(
      database,
      `sessions/${uid}/${sessionId}/status`
    );


  statusUnsub =
    onValue(
      statusRef,
      (snapshot) => {

        const newStatus =
          snapshot.val();


        if (
          !newStatus
        ) {

          return;
        }


        updateCueDisplay(
          newStatus
        );


        // Do not repeat a cue
        // for the same Firebase value.

        if (
          newStatus ===
          lastStatus
        ) {

          return;
        }


        console.log(
          "Session status changed:",
          lastStatus,
          "→",
          newStatus
        );


        lastStatus =
          newStatus;


        switch (
          newStatus
        ) {

          case "get_ready":

            playReadyCue();

            break;


          case "go":

            playGoCue();

            break;


          case "resting":

            playRestCue();

            break;


          case "finished":

            playFinishedCue();

            break;


          case "active":

            // No audio for initial session state.

            break;


          case "stopped":

            // No additional cue.

            break;


          default:

            console.log(
              "No audio cue configured for:",
              newStatus
            );
        }
      }
    );
}


// ================================================================
// STATUS DISPLAY
// ================================================================

function updateCueDisplay(
  status
) {

  const cueStatus =
    document.getElementById(
      "cueStatus"
    );


  if (
    cueStatus
  ) {

    cueStatus.textContent =
      `Current status: ${status}`;
  }
}


// ================================================================
// CLEANUP
// ================================================================

function cleanupSessionListeners() {

  if (
    repsUnsub
  ) {

    repsUnsub();

    repsUnsub =
      null;
  }


  if (
    statusUnsub
  ) {

    statusUnsub();

    statusUnsub =
      null;
  }
}


// ================================================================
// CREATE SESSION
// ================================================================

async function beginSession() {

  const newRef =
    push(
      ref(
        database,
        `sessions/${currentUid}`
      )
    );


  await set(
    newRef,
    {
      status:
        "active",

      startedAt:
        serverTimestamp()
    }
  );

  // Point the timing box at this session
  await set(
    ref(
      database,
      "devices/BOX_01/active_session"
    ),
    {
      sessionId:
        newRef.key,

      uid:
        currentUid
    }
  );
}


// ================================================================
// END SESSION
// ================================================================

async function endSession() {

  if (
    !currentUid ||
    !activeSessionId
  ) {

    return;
  }


  await update(
    ref(
      database,
      `sessions/${currentUid}/${activeSessionId}`
    ),
    {
      status:
        "completed",

      endedAt:
        serverTimestamp()
    }
  );

  // Clear the device pointer
  await set(
    ref(
      database,
      "devices/BOX_01/active_session"
    ),
    {
      sessionId:
        "",

      uid:
        ""
    }
  );
}


// ================================================================
// PWA — SERVICE WORKER
// ================================================================

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./service-worker.js")
      .catch((err) => {
        console.error("Service worker registration failed:", err);
      });
  });
}
