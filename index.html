<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Session — Track Coaching Assistant</title>

  <style>
    :root {
      --ink: #EDEDEF;
      --ink-dim: #9A9AA5;
      --bg: #15151A;
      --bg-raised: #1D1D24;
      --line: #2B2B34;
      --cinder: #C1442E;
      --amber: #F2A93B;
      --live-green: #4CAF6D;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand .mark {
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--cinder);
      letter-spacing: 0.04em;
    }

    .brand h1 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--ink-dim);
    }

    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-dim);
    }

    .status.connected .dot {
      background: var(--live-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(76, 175, 109, 0.5);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(76, 175, 109, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(76, 175, 109, 0);
      }
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    #loginView {
      max-width: 360px;
      margin: 80px auto 0;
      padding: 32px;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    #loginView h2 {
      margin-top: 0;
      font-size: 1.15rem;
    }

    #loginView label {
      display: block;
      font-size: 0.78rem;
      color: var(--ink-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 16px 0 6px;
    }

    #loginView input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font-size: 0.95rem;
      font-family: inherit;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 20px;
      border-radius: 6px;
      border: none;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin: 4px;
    }

    .btn-primary {
      background: var(--cinder);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      color: var(--ink-dim);
      border: 1px solid var(--line);
    }

    .btn-end {
      background: transparent;
      color: var(--cinder);
      border: 1px solid var(--cinder);
    }

    #loginBtn {
      width: 100%;
      margin-top: 22px;
    }

    #loginError {
      color: var(--cinder);
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 1.2em;
    }

    #appView {
      display: none;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .athlete-name {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0;
    }

    .athlete-sub {
      color: var(--ink-dim);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .session-panel {
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
    }

    .session-panel .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      color: var(--ink-dim);
    }

    .session-panel .badge.live {
      color: var(--live-green);
      border-color: var(--live-green);
    }

    .rep-count {
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      font-size: 2.4rem;
      font-weight: 700;
      margin: 4px 0;
    }

    .rep-count-label {
      color: var(--ink-dim);
      font-size: 0.8rem;
    }

    .cue-status {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--amber);
      min-height: 1.2em;
    }

    .button-row {
      margin-top: 18px;
    }

    .lanes {
      border-top: 2px solid var(--cinder);
      margin-top: 8px;
    }

    .rep-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .rep-num {
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      color: var(--amber);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .rep-rest {
      color: var(--ink-dim);
      font-size: 0.8rem;
    }

    .rep-time {
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      font-size: 1.3rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-dim);
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--ink-dim);
      font-size: 0.78rem;
    }
  </style>

</head>

<body>

<header>
  <div class="brand">
    <span class="mark">⟨/⟩</span>
    <h1>Training Session</h1>
  </div>

  <div class="status" id="connectionStatus">
    <span class="dot"></span>
    <span id="connectionLabel">Connecting…</span>
  </div>
</header>

<main>

  <!-- LOGIN -->

  <div id="loginView">
    <h2>Athlete login</h2>

```
<label for="email">Email</label>
<input id="email" type="email" placeholder="you@example.com">

<label for="password">Password</label>
<input id="password" type="password" placeholder="••••••••">

<button class="btn btn-primary" id="loginBtn">
  Log in
</button>

<div id="loginError"></div>
```

  </div>

  <!-- DASHBOARD -->

  <div id="appView">

```
<div class="top-row">
  <div>
    <p class="athlete-name" id="athleteName">—</p>
    <p class="athlete-sub" id="athleteEmail">—</p>
  </div>

  <button class="btn btn-outline" id="logoutBtn">
    Log out
  </button>
</div>


<div class="session-panel" id="sessionPanel">
</div>


<div class="lanes" id="repsList">
</div>
```

  </div>

</main>

<footer>
  IoT Athletics Track Coaching Assistant — session control &amp; live monitor
</footer>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set,
  update,
  push,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";


// ================================================================
// FIREBASE CONFIGURATION
// ================================================================

const firebaseConfig = {
  apiKey: "AIzaSyAlYe_Gmmy8B9mxCgVo5PdIZ4y1tndyCis",
  authDomain: "athletics-coach-d0b26.firebaseapp.com",
  databaseURL:
    "https://athletics-coach-d0b26-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "athletics-coach-d0b26"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);


// ================================================================
// DOM
// ================================================================

const loginView = document.getElementById("loginView");
const appView = document.getElementById("appView");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

const logoutBtn = document.getElementById("logoutBtn");

const athleteName = document.getElementById("athleteName");
const athleteEmail = document.getElementById("athleteEmail");

const sessionPanel = document.getElementById("sessionPanel");
const repsList = document.getElementById("repsList");

const connectionStatus =
  document.getElementById("connectionStatus");

const connectionLabel =
  document.getElementById("connectionLabel");


// ================================================================
// STATE
// ================================================================

let currentUid = null;
let activeSessionId = null;

let repsUnsub = null;
let statusUnsub = null;
let sessionsUnsub = null;

let lastStatus = null;

let audioContext = null;


// ================================================================
// AUDIO
// ================================================================

function unlockAudio() {

  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) {
    console.error("Web Audio API is not supported.");
    return;
  }

  if (!audioContext) {
    audioContext = new AudioContextClass();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  console.log(
    "Audio state:",
    audioContext.state
  );
}


function playTone(
  frequency,
  duration,
  delay = 0
) {

  if (!audioContext) {
    console.error(
      "Audio has not been unlocked yet."
    );
    return;
  }

  const startTime =
    audioContext.currentTime + delay;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = "sine";

  oscillator.frequency.setValueAtTime(
    frequency,
    startTime
  );

  gain.gain.setValueAtTime(
    0.0001,
    startTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.35,
    startTime + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    startTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(startTime);
  oscillator.stop(
    startTime + duration + 0.02
  );
}


function speak(text) {

  if (!("speechSynthesis" in window)) {
    console.warn(
      "Speech synthesis is not supported."
    );
    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.rate = 1.1;
  utterance.pitch = 1;
  utterance.volume = 1;

  window.speechSynthesis.speak(utterance);
}


function playGoCue() {

  // Two tones.
  playTone(880, 0.12, 0);
  playTone(1175, 0.20, 0.18);

  // Then speak GO.
  setTimeout(() => {
    speak("Go");
  }, 450);
}


function playReadyCue() {

  playTone(660, 0.18, 0);

  setTimeout(() => {
    speak("Get ready");
  }, 250);
}


function playRestCue() {

  playTone(440, 0.18, 0);

  setTimeout(() => {
    speak("Rest");
  }, 250);
}


function playFinishedCue() {

  playTone(660, 0.12, 0);
  playTone(880, 0.12, 0.15);
  playTone(1047, 0.25, 0.30);

  setTimeout(() => {
    speak("Session finished");
  }, 650);
}


// ================================================================
// FIREBASE CONNECTION
// ================================================================

onValue(
  ref(database, ".info/connected"),
  (snap) => {

    const connected =
      snap.val() === true;

    connectionStatus.classList.toggle(
      "connected",
      connected
    );

    connectionLabel.textContent =
      connected
        ? "Live"
        : "Connecting…";
  }
);


// ================================================================
// LOGIN
// ================================================================

loginBtn.addEventListener(
  "click",
  async () => {

    loginError.textContent = "";

    try {

      await signInWithEmailAndPassword(
        auth,
        emailInput.value.trim(),
        passwordInput.value
      );

    } catch (error) {

      console.error(error);

      loginError.textContent =
        "Login failed — check email and password.";
    }
  }
);


logoutBtn.addEventListener(
  "click",
  () => signOut(auth)
);


// ================================================================
// AUTH STATE
// ================================================================

onAuthStateChanged(
  auth,
  (user) => {

    cleanupSessionListeners();

    if (sessionsUnsub) {
      sessionsUnsub();
      sessionsUnsub = null;
    }

    if (!user) {

      currentUid = null;
      activeSessionId = null;
      lastStatus = null;

      loginView.style.display = "block";
      appView.style.display = "none";

      return;
    }

    currentUid = user.uid;

    loginView.style.display = "none";
    appView.style.display = "block";

    athleteName.textContent =
      user.email.split("@")[0];

    athleteEmail.textContent =
      user.email;

    update(
      ref(
        database,
        `athletes/${user.uid}`
      ),
      {
        name: user.email.split("@")[0],
        email: user.email
      }
    );

    watchForActiveSession(user.uid);
  }
);


// ================================================================
// SESSION STATUS
// ================================================================

function isLiveSessionStatus(status) {

  return [
    "active",
    "get_ready",
    "go",
    "resting"
  ].includes(status);
}


function watchForActiveSession(uid) {

  if (sessionsUnsub) {
    sessionsUnsub();
    sessionsUnsub = null;
  }

  sessionsUnsub = onValue(
    ref(database, `sessions/${uid}`),
    (snapshot) => {

      const sessions =
        snapshot.val() || {};

      const liveEntry =
        Object.entries(sessions)
          .find(
            ([, session]) =>
              isLiveSessionStatus(
                session.status
              )
          );

      if (liveEntry) {

        const sessionId =
          liveEntry[0];

        const sessionData =
          liveEntry[1];

        if (
          activeSessionId !== sessionId
        ) {

          activeSessionId =
            sessionId;

          lastStatus = null;

          renderActiveSession(
            uid,
            sessionId,
            sessionData
          );

        } else {

          updateCueDisplay(
            sessionData.status
          );
        }

      } else {

        activeSessionId = null;
        lastStatus = null;

        renderNoActiveSession();
      }
    }
  );
}


// ================================================================
// NO ACTIVE SESSION
// ================================================================

function renderNoActiveSession() {

  cleanupSessionListeners();

  sessionPanel.innerHTML = `
    <span class="badge">
      no active session
    </span>

    <div
      class="rep-count-label"
      style="margin-bottom:16px;"
    >
      Start a session before training begins.
    </div>

    <button
      class="btn btn-primary"
      id="beginBtn"
    >
      Begin session
    </button>
  `;

  document
    .getElementById("beginBtn")
    .addEventListener(
      "click",
      async () => {

        // Important:
        // This is a direct user interaction,
        // so mobile Chrome can unlock audio.
        unlockAudio();

        await beginSession();
      }
    );

  repsList.innerHTML = "";
}


// ================================================================
// ACTIVE SESSION
// ================================================================

function renderActiveSession(
  uid,
  sessionId,
  sessionData
) {

  sessionPanel.innerHTML = `
    <span class="badge live">
      session live
    </span>

    <div
      class="rep-count"
      id="repCount"
    >
      0
    </div>

    <div class="rep-count-label">
      rep(s) completed
    </div>

    <div
      class="cue-status"
      id="cueStatus"
    >
      Current status:
      ${sessionData.status || "active"}
    </div>

    <div class="button-row">

      <button
        class="btn btn-primary"
        id="testSoundBtn"
      >
        Test GO Sound
      </button>

      <button
        class="btn btn-end"
        id="endBtn"
      >
        End session
      </button>

    </div>
  `;


  // ------------------------------------------------
  // TEST GO SOUND BUTTON
  // ------------------------------------------------

  document
    .getElementById("testSoundBtn")
    .addEventListener(
      "click",
      () => {

        // Direct button press unlocks audio.
        unlockAudio();

        // Play immediately while still close to
        // the user interaction.
        playGoCue();
      }
    );


  // ------------------------------------------------
  // END SESSION BUTTON
  // ------------------------------------------------

  document
    .getElementById("endBtn")
    .addEventListener(
      "click",
      endSession
    );


  watchReps(
    uid,
    sessionId
  );

  watchSessionStatus(
    uid,
    sessionId
  );
}


// ================================================================
// REP LISTENER
// ================================================================

function watchReps(
  uid,
  sessionId
) {

  if (repsUnsub) {
    repsUnsub();
    repsUnsub = null;
  }

  repsUnsub = onValue(
    ref(
      database,
      `sessions/${uid}/${sessionId}/reps`
    ),
    (snapshot) => {

      const reps =
        snapshot.val() || {};

      const repIds =
        Object.keys(reps)
          .sort(
            (a, b) =>
              Number(a) - Number(b)
          );

      const countEl =
        document.getElementById("repCount");

      if (countEl) {
        countEl.textContent =
          repIds.length;
      }

      if (repIds.length === 0) {

        repsList.innerHTML = `
          <div class="empty-state">
            Waiting on the timing box
            for the first rep…
          </div>
        `;

        return;
      }

      repsList.innerHTML =
        repIds
          .map(
            (id) => {

              const rep =
                reps[id];

              const restNote =
                rep.restBefore != null &&
                Number(rep.restBefore) > 0

                  ? `${Number(
                      rep.restBefore
                    ).toFixed(0)}s rest before this rep`

                  : "first rep";

              return `
                <div class="rep-row">

                  <span class="rep-num">
                    #${Number(id) + 1}
                  </span>

                  <div>
                    <div class="rep-rest">
                      ${restNote}
                    </div>
                  </div>

                  <span class="rep-time">
                    ${Number(
                      rep.time
                    ).toFixed(2)}s
                  </span>

                </div>
              `;
            }
          )
          .join("");
    }
  );
}


// ================================================================
// STATUS LISTENER
// ================================================================

function watchSessionStatus(
  uid,
  sessionId
) {

  if (statusUnsub) {
    statusUnsub();
    statusUnsub = null;
  }

  statusUnsub = onValue(
    ref(
      database,
      `sessions/${uid}/${sessionId}/status`
    ),
    (snapshot) => {

      const newStatus =
        snapshot.val();

      if (!newStatus) {
        return;
      }

      updateCueDisplay(newStatus);

      // Do not repeat a sound
      // for the same Firebase value.
      if (
        newStatus === lastStatus
      ) {
        return;
      }

      console.log(
        "Status changed:",
        lastStatus,
        "→",
        newStatus
      );

      lastStatus = newStatus;

      switch (newStatus) {

        case "get_ready":
          playReadyCue();
          break;

        case "go":
          playGoCue();
          break;

        case "resting":
          playRestCue();
          break;

        case "finished":
          playFinishedCue();
          break;

        case "active":
          // No sound needed.
          break;

        default:
          console.log(
            "No audio cue configured for:",
            newStatus
          );
      }
    }
  );
}


function updateCueDisplay(status) {

  const cueStatus =
    document.getElementById("cueStatus");

  if (cueStatus) {

    cueStatus.textContent =
      `Current status: ${status}`;
  }
}


// ================================================================
// CLEANUP
// ================================================================

function cleanupSessionListeners() {

  if (repsUnsub) {
    repsUnsub();
    repsUnsub = null;
  }

  if (statusUnsub) {
    statusUnsub();
    statusUnsub = null;
  }
}


// ================================================================
// CREATE SESSION
// ================================================================

async function beginSession() {

  const newRef =
    push(
      ref(
        database,
        `sessions/${currentUid}`
      )
    );

  await set(
    newRef,
    {
      status: "active",
      startedAt: serverTimestamp()
    }
  );
}


// ================================================================
// END SESSION
// ================================================================

async function endSession() {

  if (
    !currentUid ||
    !activeSessionId
  ) {
    return;
  }

  await update(
    ref(
      database,
      `sessions/${currentUid}/${activeSessionId}`
    ),
    {
      status: "completed",
      endedAt: serverTimestamp()
    }
  );
}

</script>

</body>
</html>
